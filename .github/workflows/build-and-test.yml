name: Build and Test Parser+AST

# Dispara em pushes/pull requests na branch sintatico e também manualmente
on:
  push:
    branches: [ "sintatico" ]
  pull_request:
    branches: [ "sintatico" ]
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repo tree
        run: ls -la

      - name: Install build deps (g++)
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Compile sources
        # Ajuste o comando abaixo se você tiver .c ou nomes diferentes
        run: |
          echo "Compiling"
          g++ -std=c++17 -Wall -Wextra *.cpp *.c -o tp || { echo "Compile failed"; exit 1; }
          echo "Compiled binary size:"
          ls -lh tp

      - name: Create test input (sample1)
        run: |
          cat > input1.txt <<'EOF'
          Inteiro x <- 10, y <- 20;

          Enquanto x < y {
              x <- x + 1;
          }

          Se x = y {
              Imprimir(x);
          }
          EOF
          echo "Test input written:"
          cat input1.txt

      - name: Run parser on input1
        run: |
          echo "Running parser..."
          ./tp < input1.txt > out1.txt 2>&1 || { echo "Runtime failed"; exit 1; }
          echo "Run complete. Output:"
          sed -n '1,200p' out1.txt

      - name: Create test input (sample2: strings and expo)
        run: |
          cat > input2.txt <<'EOF'
          Inteiro a <- 2 ** 3;
          Imprimir("Resultado: " + a);
          EOF
          echo "Test input 2 written"
          cat input2.txt

      - name: Run parser on input2
        run: |
          ./tp < input2.txt > out2.txt 2>&1 || { echo "Runtime failed"; exit 1; }
          echo "Output 2:"
          sed -n '1,200p' out2.txt

      - name: Upload artifacts (logs)
        uses: actions/upload-artifact@v4
        with:
          name: parser-logs
          path: |
            out1.txt
            out2.txt

