name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Install dependencies
      run: sudo apt-get install g++ make -y

    - name: Compile project
      run: |
        g++ -o tp ast.cpp parser.cpp tp-compiladores.cpp

    - name: Create test input (sample1)
      run: |
        cat > input1.txt << 'EOF'
        Inteiro x <- 10;
        Imprimir(x);
        EOF
        echo "Test input 1 written"
        cat input1.txt

    - name: Run parser on input1
      run: |
        echo "Running parser..."
        ./tp < input1.txt > out1.txt 2>&1 || { echo "Runtime failed"; exit 1; }
        echo "Run complete"

    - name: Create test input (sample2)
      run: |
        cat > input2.txt << 'EOF'
        Inteiro a <- 2 ** 3;
        Imprimir("Resultado: " + a);
        EOF
        echo "Test input 2 written"
        cat input2.txt

    - name: Run parser on input2
      run: |
        echo "Running parser 2..."
        ./tp < input2.txt > out2.txt 2>&1 || { echo "Runtime failed"; exit 1; }
        echo "Run complete"
